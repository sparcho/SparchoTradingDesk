name: Refresh company news (live · loop, market hours)

# JOURNALIST-owned live news pipeline (F260622). Each cycle:
#   - refresh_news.py : Marketaux API (NEWS_API_KEY secret) + Google-News-RSS fallback -> vetted
#                       data/news_candidates.json (deterministic relevance/dedup/recency/cap).
#   - curate_news.py  : JOURNALIST vetting rules (credibility/sentiment/materiality/why) ->
#                       data/news_curated.json (the published set the dashboard reads).
# Bulletproof: stdlib only (no pip), per-source try/except, last-good cache (a 0-result run keeps
# the last good file + stamps stale — the panel never blanks). NSE-session gated in the scripts, so
# holiday runs no-op silently. If NEWS_API_KEY is unset it runs RSS-only (still fully functional).
#
# 2026-09-07 — LOOPS INSTEAD OF WAITING TO BE WOKEN.
#
# The `*/5` cron asks for ~100 runs on a weekday. Measured over the six days to 2026-09-07 it ran
# 6, 8, 7, 1, 0, 3. GitHub delivers `schedule` events best-effort and drops most of them under load.
# For this job the cost is specific: news is how a catalyst on a held name reaches the operator, and
# he is about to travel with the dashboard as his only surface. A headline that arrives six hours
# late has already been priced by everyone else.
#
# Same cure as PULSE and the equity live overlay: cron becomes one of several ways to START a loop,
# starts sit on odd minutes because round minutes are the busiest and the likeliest to be dropped,
# and one run covers the next stretch itself.

on:
  schedule:
    # Odd minutes, three starting chances an hour. Any ONE covers the next ~50 minutes.
    - cron: '13,33,53 3-10 * * 1-5'    # NSE market hours — starts a loop
    - cron: '17,47 0-2,11-23 * * 1-5'  # off-hours — single pass, overnight headlines
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sparcho-desk-main-push      # shared main-branch queue — never race the aggregate push
  cancel-in-progress: false

env:
  REBUILD_EVERY_MIN: 10      # headlines do not move fast enough to justify 5
  LOOP_MINUTES: 8          # F260908-QUEUESTARVE: headlines do not move fast, and this job shares its lock with silver.
                             # 8 min x 3 firings/hour = 24 lock-min/hour;
                             # the two of them together fit inside the hour.
  SESSION_FROM_UTC: "03:00"  # 08:30 IST — pre-open headlines matter
  SESSION_TO_UTC: "11:00"    # 16:30 IST — a little past the close

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch, vet and publish news on a loop
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          set -uo pipefail

          in_window () {
            now=$(date -u +%H:%M)
            [[ "$now" > "$SESSION_FROM_UTC" && "$now" < "$SESSION_TO_UTC" ]]
          }

          # Both scripts keep a last-good cache, so a failed fetch leaves the panel showing the
          # previous set rather than blanking. Failures are warnings, never fatal.
          rebuild () {
            python stocks/generators/refresh_news.py || echo "::warning::news fetch failed (last-good kept)"
            python stocks/generators/curate_news.py  || echo "::warning::curation failed (last-good kept)"
          }

          # The news files are independent of the aggregate, so a clean regenerate-on-latest is
          # always safe — there is no encrypted block to preserve here.
          publish () {
            git add stocks/data/news_candidates.json stocks/data/news_curated.json
            if git diff --cached --quiet; then echo "no news change this cycle"; return 0; fi
            git commit -q -m "auto: company news refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push -q; then echo "pushed"; return 0; fi
            for i in 1 2 3; do
              git fetch -q origin main || { sleep 4; continue; }
              git reset -q --hard origin/main
              rebuild
              git add stocks/data/news_candidates.json stocks/data/news_curated.json
              if git diff --cached --quiet; then echo "no net change after reset"; return 0; fi
              git commit -q -m "auto: company news refresh (rebuilt on latest) $(date -u +'%Y-%m-%d %H:%M UTC')"
              if git push -q; then echo "pushed (retry $i)"; return 0; fi
              sleep $((RANDOM % 6 + 4))
            done
            echo "::warning::could not push news this cycle — the next one will try again"
            return 0
          }

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! in_window; then
            echo "outside the news window ($(date -u +%H:%M) UTC) — single off-hours pass"
            rebuild
            publish
            exit 0
          fi

          deadline=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          cycle=0
          while :; do
            cycle=$(( cycle + 1 ))
            if ! in_window; then
              # Leave at once rather than sleeping: sleeping holds the shared concurrency slot.
              echo "window closed at $(date -u +%H:%M) UTC after $cycle cycle(s)"
              break
            fi
            echo "--- cycle $cycle at $(date -u +%H:%M) UTC ---"
            rebuild
            publish
            if [ $(( $(date +%s) + REBUILD_EVERY_MIN * 60 )) -ge "$deadline" ]; then
              echo "loop finished after $cycle cycle(s)"
              break
            fi
            sleep $(( REBUILD_EVERY_MIN * 60 ))
          done
