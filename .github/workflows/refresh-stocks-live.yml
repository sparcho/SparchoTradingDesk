name: Refresh stocks dashboard (live · loop, market hours)

# THE MOVING PARTS of the equity dashboard, kept fresh through the session:
#   - held last-price + day-moves + universe moves   (refresh_prices.py)
#   - regime live readings: TNX / DXY / USDINR / Brent / CCC OAS   (ci_regime_refresh.py)
#
# 2026-09-07 — IT NO LONGER WAITS TO BE WOKEN.
#
# This job asked for `*/5` during market hours: about 123 runs on a weekday. Measured over the six
# sessions to 2026-09-07 it actually ran:
#
#     2026-09-02   10        2026-09-05    1
#     2026-09-03   10        2026-09-06    2
#     2026-09-04    9        2026-09-07    4
#
# Five to ten per cent of what it asked for. GitHub delivers `schedule` events best-effort and drops
# most of them under load — and the higher the requested frequency, the worse it gets. The
# consequence was on the operator's screen: the watchdog kept logging "equity aggregate 222m stale
# (tol 45m, intraday)" and self-healing, so the desk he trades from showed prices up to four hours
# old in the middle of the session.
#
# PULSE hit exactly this wall on 2026-09-02 and solved it: stop treating cron as a clock and make the
# job RUN A LOOP. Cron is demoted from "the clock" to "one of several ways to get a loop started",
# and starts sit on odd minutes because round minutes are the busiest and the likeliest to be
# dropped. Measured on the same six days, pulse ran 51-52 times a session against a nominal ~40. The
# pattern works; this job never got it.
#
# Why it is affordable: the repo is public, so Actions minutes are free. A loop that lives for
# LOOP_MINUTES and refreshes every REBUILD_EVERY_MIN costs nothing but wall time.
#
# CONCURRENCY. The group is shared with the heavy post-close job (16:30 IST / 11:00 UTC) so the two
# can never push the aggregate at the same time. The loop's window closes at 10:10 UTC, well before
# that — and it BREAKS OUT the moment it is outside the window rather than sleeping, because
# sleeping would hold the shared slot against a job that has real work to do.
#
# The OFF-HOURS cadence stays a single pass: overnight there is one macro/regime reading to collect
# and nothing to loop over, and an overnight loop would hold the shared slot all night.

on:
  schedule:
    # Many starting chances on odd minutes. Any ONE of them firing covers the next fifty minutes,
    # so the schedule no longer has to be accurate — only occasionally lucky.
    - cron: '7,27,47 3-10 * * 1-5'    # NSE market hours (~09:15-15:35 IST) — starts a loop
    - cron: '9,39 0-2,11-23 * * 1-5'  # off-hours — single pass, overnight macro / regime
  workflow_dispatch:

permissions:
  contents: write

# F260908-QUEUESTARVE. Measured on 2026-09-08: the equity desk refreshed prices ONCE in a
# six-hour NSE session (13:08-13:55 IST), with a 7h24m gap straight through the open, and five of
# the day's twenty-one refresh runs cancelled outright.
#
# Two arithmetic errors, both introduced with the loop pattern on 2026-09-07:
#
#   1. LOOP_MINUTES was LONGER than the gap between the workflow's own triggers (50 vs 20). A run
#      still holding the lock when its next two triggers arrive queues one and lets the third
#      DELETE it -- GitHub keeps a single pending run per group. The loop starved itself before
#      any other job was involved.
#   2. All three loops shared one concurrency group, jointly demanding 420 lock-minutes per hour
#      out of the 60 an hour contains. Permanently saturated, and the loser was whichever job
#      queued behind a long-running sibling -- in practice the equity desk, while silver and news
#      each held uninterrupted 30-67 minute loops.
#
# The loop pattern itself was right (scheduled triggers get dropped, so one surviving trigger should
# cover a stretch). Converting many short runs into one long run holding a LOCK is what was wrong,
# and that cost was never priced. Enforced now by TESTS/test_a_loop_cannot_outlive_its_own_cron.py.
#
# This job is on its OWN lock. It is the desk the operator trades, and it must not be able
# to lose its slot to the silver or news refresh. F143's reason for one shared queue was
# that no two cloud pushes should race the aggregate -- but the push path rebases and
# retries on conflict, and today's log is full of "(rebuilt on latest)" commits, which is
# that hardening working. The queue was belt-and-braces over a belt that holds, and it
# cost the trading desk its intraday prices.
concurrency:
  group: sparcho-equity-live
  cancel-in-progress: false

env:
  REBUILD_EVERY_MIN: 5       # the live overlay's intended intraday cadence
  LOOP_MINUTES: 15           # MUST stay under the 20-minute cron gap, or a run is still
                             # holding the lock when its own next trigger arrives and the
                             # one after that deletes it (F260908-QUEUESTARVE).
  SESSION_FROM_UTC: "03:40"  # 09:10 IST — just before the open
  SESSION_TO_UTC: "10:10"    # 15:40 IST — a little past the close

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 70      # LOOP_MINUTES plus headroom; nowhere near the 6h job ceiling
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet yfinance numpy pyyaml cryptography

      - name: Refresh live prices + regime on a loop
        # F260729-HELDLEAK: the held tickers live inside sensitive_enc, so refresh_prices needs the
        # desk password to READ them. It only decrypts — it never re-seals the block, so it cannot
        # corrupt the ciphertext or change what the page unlocks with.
        env:
          DESK_UNLOCK_PW: ${{ secrets.DESK_UNLOCK_PW }}
        run: |
          set -uo pipefail

          in_window () {
            now=$(date -u +%H:%M)
            [[ "$now" > "$SESSION_FROM_UTC" && "$now" < "$SESSION_TO_UTC" ]]
          }

          # One refresh cycle. Regime failures are warnings by design: a Yahoo/FRED hiccup on the
          # macro rails must never block the PRICE overlay, which is the part the operator reads.
          rebuild () {
            python stocks/generators/refresh_prices.py || echo "::warning::price overlay failed (continuing)"
            python stocks/engine/ci_regime_refresh.py  || echo "::warning::regime readings failed (continuing)"
          }

          # Push hardening, carried over unchanged from the single-shot version and load-bearing:
          # the aggregate carries the operator's ENCRYPTED book, so a moved remote must never be
          # MERGED. Reset to the remote and re-overlay instead — refresh_prices preserves the
          # remote's sensitive_enc because in locked mode it touches only public price fields.
          publish () {
            git add stocks/data/equity_dashboard_aggregate.json stocks/data/prices.json
            if git diff --cached --quiet; then echo "no change this cycle"; return 0; fi
            git commit -q -m "auto: live prices + regime readings $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push -q; then echo "pushed"; return 0; fi
            echo "push rejected — remote moved; re-overlaying on latest and retrying"
            for i in 1 2 3; do
              git fetch -q origin main || { sleep 4; continue; }
              git reset -q --hard origin/main
              rebuild
              git add stocks/data/equity_dashboard_aggregate.json stocks/data/prices.json
              if git diff --cached --quiet; then echo "no net change after re-overlay"; return 0; fi
              git commit -q -m "auto: live prices + regime readings (rebuilt on latest) $(date -u +'%Y-%m-%d %H:%M UTC')"
              if git push -q; then echo "pushed (rebuild $i)"; return 0; fi
              sleep $((RANDOM % 6 + 4))
            done
            # Never abort the loop over one failed push. The next cycle is minutes away, and a dead
            # loop is a stale desk — the exact failure this change exists to end.
            echo "::warning::could not push this cycle — the next one will try again"
            return 0
          }

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # OFF-HOURS: one pass and out. Nothing to loop over overnight, and looping would hold the
          # shared concurrency slot all night against the heavy job.
          if ! in_window; then
            echo "outside the session window ($(date -u +%H:%M) UTC) — single off-hours pass"
            rebuild
            publish
            exit 0
          fi

          deadline=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          cycle=0
          while :; do
            cycle=$(( cycle + 1 ))
            if ! in_window; then
              # Leave AT ONCE rather than sleeping: sleeping holds the shared slot, which would
              # delay the heavy job or a legitimate run arriving at the window boundary.
              echo "window closed at $(date -u +%H:%M) UTC after $cycle cycle(s)"
              break
            fi
            echo "--- cycle $cycle at $(date -u +%H:%M) UTC ---"
            rebuild
            publish
            if [ $(( $(date +%s) + REBUILD_EVERY_MIN * 60 )) -ge "$deadline" ]; then
              echo "loop finished after $cycle cycle(s)"
              break
            fi
            sleep $(( REBUILD_EVERY_MIN * 60 ))
          done

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "⚠ Stocks live-refresh FAILED — $(date -u +'%Y-%m-%d %H:%M UTC')" \
            --body "The looping live refresh (prices + regime readings) failed; the dashboard holds the last good build. Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "issue create failed (non-fatal)"
