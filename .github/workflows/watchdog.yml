name: Dashboard freshness watchdog

# Autonomous fail-loud monitor: every 3h it judges whether the PUBLISHED dashboard
# data is actually current (NSE-session-aware via daytrade_freshness). On any breach
# the job FAILS -> GitHub emails the operator -> no need to open anything to discover
# staleness. Writes stocks/data/health.json either way. No host in the loop.
#
# TWO ARMS, and they answer DIFFERENT questions (F260730-WDORPHAN):
#   watchdog_check.py — is the published PAYLOAD current? (emit age, session-aware)
#   watchdog_ci.py    — did the PRODUCER actually succeed? (workflow conclusions) + writes the
#                       notifications feed and its daily heartbeat.
# The second arm existed on disk but was invoked by NOTHING, and the gap is not academic: on
# 28-29 Jul 2026 ci_fib_refresh aborted on 4 consecutive runs (InvalidTag — it built a correct
# radar each time and could not re-seal it). refresh-stocks-dashboard.yml is in its
# CRITICAL_WORKFLOWS and CONSEC_FAIL_ALERT is 3, so it would have alerted on the third. Instead
# the payload stayed fresh (prices kept flowing), this arm's age checks all passed, health.json
# read overall:OK for two days, and the operator found the resulting stale radar price by eye.
# An age check CANNOT see a dead producer whose siblings keep the file's timestamp moving —
# that is exactly V-37's freshness-layer-vs-substance-layer split. Guarded by the vault's
# TESTS/test_cloud_watchdog_is_wired.py so an arm can never be orphaned again.

on:
  schedule:
    - cron: '0 */3 * * *'      # every 3 hours, all days
  workflow_dispatch:

concurrency:
  group: sparcho-desk-main-push        # F143: EVERY main-branch pusher shares ONE queue so no two
  cancel-in-progress: false  # cloud pushes never race each other -> the host's cooperative
                             # yield (deploy_common) can reliably slot its publish into a gap.

permissions:
  contents: write
  actions: write               # watchdog_ci re-triggers a dead producer's workflow

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Commit health.json (always — even when the check below fails)
        id: health
        run: |
          python stocks/generators/watchdog_check.py > /tmp/wd.txt 2>&1 || echo "BREACH=1" >> "$GITHUB_ENV"
          cat /tmp/wd.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stocks/data/health.json || true
          if git diff --cached --quiet; then
            echo "no health change"; exit 0
          fi
          git commit -m "watchdog health $(date -u +'%Y-%m-%d %H:%M UTC')"
          if git push; then echo "pushed (fast path)"; exit 0; fi
          # F260730-WDORPHAN: this was the ONLY pusher in the repo without a rebase-retry, so any
          # concurrent push (there are five other cron pushers on the shared queue, plus the host's
          # publish) failed the whole watchdog run — taking the producer-health arm down with it.
          # health.json is fully recomputed from the checkout, so rebasing and re-running is always
          # safe: there is no local state to lose.
          echo "push rejected — remote moved; rebasing onto latest and retrying"
          for i in 1 2 3 4 5; do
            git fetch origin main || { sleep 4; continue; }
            git reset --hard origin/main
            python stocks/generators/watchdog_check.py > /tmp/wd.txt 2>&1 || echo "BREACH=1" >> "$GITHUB_ENV"
            git add stocks/data/health.json || true
            if git diff --cached --quiet; then echo "no net change after rebuild — done"; exit 0; fi
            git commit -m "watchdog health (rebuilt on latest) $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push; then echo "pushed (attempt $i)"; exit 0; fi
            echo "attempt $i rejected — backing off"; sleep $((RANDOM % 6 + 4))
          done
          echo "::error::could not push health.json after rebase retries"
          exit 1

      # ARM 2 (F260730-WDORPHAN) — did the PRODUCERS succeed? Reads workflow conclusions, alerts on
      # a CONSEC_FAIL_ALERT streak, re-triggers best-effort, and appends the spotted->action->outcome
      # event + daily heartbeat to status/notifications.json (the landing page's System status panel).
      #
      # continue-on-error: this arm must never cost the run its health.json commit or mask a real
      # freshness breach below. It exits 0 by design anyway ("a watchdog must never fail the
      # workflow"), so a non-zero here means the arm itself broke — surfaced by the gate at the end
      # rather than swallowed, because a silently-broken watchdog is the defect this arm exists for.
      - name: Cloud watchdog — producer health + notifications feed
        id: wdci
        # if: always() — a watchdog gated behind another step's success is OFF exactly when things
        # are going wrong. Learned on the first live run after wiring (30519101562): the health-commit
        # step above lost a routine push race, exited 1, and GitHub skipped this arm on the very run
        # meant to prove it works.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python status/watchdog_ci.py
          # watchdog_ci.main() ends at nf.append_events() — it writes the feed into the RUNNER's
          # working tree and returns. There is NO git commit anywhere in the script, despite its
          # docstring claiming it appends an event "then commit". Verified on run 30519285527: the
          # arm ran, caught a real live-parity problem, and the published feed stayed frozen at
          # 2026-07-28 because the file died with the runner. A finding computed and thrown away is
          # the same nothing as a finding never computed. The commit belongs here.
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status/notifications.json || true
          if git diff --cached --quiet; then
            echo "no new watchdog events"; exit 0
          fi
          git commit -m "watchdog notifications $(date -u +'%Y-%m-%d %H:%M UTC')"
          if git push; then echo "pushed (fast path)"; exit 0; fi
          echo "push rejected — remote moved; replaying the append onto latest"
          for i in 1 2 3 4 5; do
            git fetch origin main || { sleep 4; continue; }
            # keep OUR feed file across the reset: the events were computed from state this run
            # observed, and the remote's copy may carry OTHER producers' events we must not drop.
            cp status/notifications.json /tmp/notif_ours.json
            git reset --hard origin/main
            python - <<'PY'
          import json, pathlib
          # merge: remote feed + our new events, deduped on (ts_utc, subsystem), newest first
          ours = json.loads(pathlib.Path('/tmp/notif_ours.json').read_text(encoding='utf-8'))
          p = pathlib.Path('status/notifications.json')
          base = json.loads(p.read_text(encoding='utf-8')) if p.exists() else {'events': []}
          seen, merged = set(), []
          for e in (ours.get('events') or []) + (base.get('events') or []):
              k = (e.get('ts_utc'), e.get('subsystem'), e.get('spotted'))
              if k in seen:
                  continue
              seen.add(k); merged.append(e)
          merged.sort(key=lambda e: str(e.get('ts_utc') or ''), reverse=True)
          base['events'] = merged[:200]
          base['updated_at_utc'] = max((str(e.get('ts_utc') or '') for e in merged), default='')
          p.write_text(json.dumps(base, indent=1, ensure_ascii=False), encoding='utf-8')
          print('merged feed: %d event(s)' % len(merged))
          PY
            git add status/notifications.json || true
            if git diff --cached --quiet; then echo "no net change after merge — done"; exit 0; fi
            git commit -m "watchdog notifications (merged on latest) $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push; then echo "pushed (attempt $i)"; exit 0; fi
            echo "attempt $i rejected — backing off"; sleep $((RANDOM % 6 + 4))
          done
          echo "::error::could not push notifications.json after merge retries"
          exit 1

      - name: Fail the run on breach (triggers GitHub failure email)
        if: env.BREACH == '1'
        run: |
          echo "::error::Dashboard freshness breach — published data is stale. See stocks/data/health.json"
          exit 1

      - name: Fail the run if the cloud watchdog arm itself broke
        if: steps.wdci.outcome == 'failure'
        run: |
          echo "::error::status/watchdog_ci.py exited non-zero — it is designed to always exit 0,"
          echo "::error::so the producer-health arm is BROKEN and is no longer watching. See the step log."
          exit 1
