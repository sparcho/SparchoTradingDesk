const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Always two decimals: letting toLocaleString drop them puts "1,349" beside "1,701.10" in one row,
// which the broker never does and which reads as sloppy before it reads as informative.
const money = v => v==null ? '-' : (+v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = v => v==null ? '-' : ((v>=0?'+':'')+(+v).toFixed(2)+'%');
const ROWS = [];
(LIB.groups||[]).forEach(g => (g.names||[]).forEach(n => ROWS.push({
  ticker:n.ticker, name:n.name||n.ticker, group:g.name||'Other',
  price:n.price, chg:n.day_chg_pct, status:n.status||'watch'})));
const GROUPS = (LIB.groups||[]).map(g => g.name);
let ST = {q:'', status:'all', sort:'name', view:'grouped', cat:'ALL'};
function counts(){ const c={}; ROWS.forEach(r => c[r.group]=(c[r.group]||0)+1); return c; }
function renderCats(){
  const c = counts(), names = GROUPS.filter(g => c[g]), el = document.getElementById('cats');
  el.innerHTML = '<span class="cat'+(ST.cat==='ALL'?' on':'')+'" data-c="ALL">All<span class="n">'+ROWS.length+'</span></span>'
    + names.map(g => '<span class="cat'+(ST.cat===g?' on':'')+'" data-c="'+esc(g)+'">'+esc(g)+'<span class="n">'+c[g]+'</span></span>').join('');
  el.querySelectorAll('.cat').forEach(n => n.onclick = () => { ST.cat = n.dataset.c; renderCats(); render(); });
}
function match(r){
  if (ST.cat !== 'ALL' && r.group !== ST.cat) return false;

  if (ST.q){ const q = ST.q.toLowerCase();
    if (!(r.ticker.toLowerCase().includes(q) || (r.name||'').toLowerCase().includes(q))) return false; }
  return true;
}
function sorted(rows){
  const a = rows.slice();
  if (ST.sort==='name')  a.sort((x,y)=> x.ticker.localeCompare(y.ticker));
  if (ST.sort==='gain')  a.sort((x,y)=> (y.chg==null?-1e9:y.chg)-(x.chg==null?-1e9:x.chg));
  if (ST.sort==='lose')  a.sort((x,y)=> (x.chg==null?1e9:x.chg)-(y.chg==null?1e9:y.chg));
  if (ST.sort==='price') a.sort((x,y)=> (y.price||0)-(x.price||0));
  return a;
}
function card(r){
  const cls = 'watchst';   /* F260825: one class for every card - see the payload note */
  const dir = r.chg==null ? 'flat' : r.chg > 0.02 ? 'up' : r.chg < -0.02 ? 'dn' : 'flat';
  const arrow = dir==='up' ? '▲' : dir==='dn' ? '▼' : '·';
  let tags = '<span class="tag sect">'+esc(r.group)+'</span>';
  /* F260825: no held/closed tag - the desk's relationship to a name is not public. */
  return '<a class="tk '+cls+'" href="./'+esc(r.ticker)+'/index.html"><span class="sheen"></span>'
    + '<div class="lift"><div class="r1"><span class="sym">'+esc(r.ticker)+'</span>'
    + '<span class="chg '+dir+'">'+arrow+' '+pct(r.chg)+'</span></div>'
    + '<div class="nm">'+esc(r.name)+'</div>'
    + '<div class="px"><span class="cur">₹</span>'+money(r.price)+'</div></div>'
    + '<div class="tags">'+tags+'</div></a>';
}
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
function bindTilt(){
  document.querySelectorAll('.tk').forEach(c => {
    c.addEventListener('pointermove', e => {
      if (REDUCE) return;
      const b = c.getBoundingClientRect();
      const px = (e.clientX-b.left)/b.width, py = (e.clientY-b.top)/b.height;
      c.style.setProperty('--mx',(px*100)+'%'); c.style.setProperty('--my',(py*100)+'%');
      c.style.transform = 'rotateY('+((px-.5)*10)+'deg) rotateX('+((.5-py)*10)+'deg) translateZ(5px)';
    });
    c.addEventListener('pointerleave', () => { c.style.transform=''; });
  });
}
function render(){
  const rows = ROWS.filter(match), app = document.getElementById('app');
  if (!rows.length){ app.innerHTML='<div class="empty">nothing matches that filter</div>'; foot(0); return; }
  if (ST.view==='flat' || ST.sort!=='name' || ST.cat!=='ALL'){
    app.innerHTML = '<div class="grid">'+sorted(rows).map(card).join('')+'</div>';
  } else {
    let h='';
    for (const g of GROUPS){
      const inG = sorted(rows.filter(r => r.group===g));
      if (!inG.length) continue;
      h += '<div class="sec"><span class="nm2">'+esc(g)+'</span><span class="ct">'+inG.length+'</span><span class="rule"></span></div>'
         + '<div class="grid">'+inG.map(card).join('')+'</div>';
    }
    app.innerHTML = h;
  }
  bindTilt(); foot(rows.length);
}
function foot(n){
  document.getElementById('foot').textContent =
    n+' of '+ROWS.length+' names shown · each card opens that name\'s page';
}
function seg(id,key){
  const box = document.getElementById(id);
  box.querySelectorAll('button').forEach(b => b.onclick = () => {
    box.querySelectorAll('button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); ST[key] = b.dataset.s || b.dataset.o || b.dataset.v; render();
  });
}
document.getElementById('asof').textContent =
  (LIB.count||ROWS.length)+' names · prices as of the last desk publish ('+(LIB.emitted||'unknown')+')';
document.getElementById('q').addEventListener('input', e => { ST.q = e.target.value.trim(); render(); });
seg('segSort','sort'); seg('segView','view');
renderCats(); render();
</script></body></html>
